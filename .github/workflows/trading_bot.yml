name: Argon Quant v3.5 Quantfury Copilot

on:
  schedule:
    # Encendido automático de sesión completa + respaldos horarios
    - cron: '25 13 * * 1-5'
    - cron: '0 14,15,16,17,18,19 * * 1-5'
  workflow_dispatch:

# Impide que se abran dos bots a la vez si ya está corriendo el de la tarde
concurrency:
  group: quantfury_live_copilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quantfury_copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar código y libro contable
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar Copiloto Continuo en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_CAPITAL: '2000'
        run: python bot.py

      - name: Guardar Contabilidad Actualizada en el Repositorio
        if: always()
        run: |
          git config --global user.name "Argon Quant Bot"
          git config --global user.email "bot@argonquant.local"
          git add portfolio_state.json || true
          git diff --staged --quiet || (git commit -m "Actualización contable Quantfury" && git pull --rebase -X ours && git push)
