name: Argon Quant v3.5 Quantfury Copilot

on:
  schedule:
    # Se ejecuta cada 5 minutos de Lunes a Viernes durante la sesión de EE.UU.
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write # Permiso para guardar tu libro contable (portfolio_state.json) automáticamente

jobs:
  quantfury_copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código y libro contable
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar Escáner y Escucha Interactiva en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_CAPITAL: '10000' # Cámbialo cuando quieras escribiendo /capital en Telegram
        run: python bot.py

      - name: Guardar Contabilidad Actualizada en el Repositorio
        run: |
          git config --global user.name "Argon Quant Bot"
          git config --global user.email "bot@argonquant.local"
          git add portfolio_state.json || true
          git diff --staged --quiet || (git commit -m "Actualización contable Quantfury" && git pull --rebase && git push)
