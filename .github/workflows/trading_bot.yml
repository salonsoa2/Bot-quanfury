name: Argon Quant v3.5 Quantfury Copilot

on:
  schedule:
    # Relevos automáticos en Hora Española (CEST = UTC+2):
    # 15:20 ESP (Apertura), 16:50 ESP, 18:20 ESP, 19:40 ESP (Tarde) y 21:00 ESP (Cierre)
    - cron: '20 13 * * 1-5'
    - cron: '50 14 * * 1-5'
    - cron: '20 16 * * 1-5'
    - cron: '40 17 * * 1-5'
    - cron: '0 19 * * 1-5'
  workflow_dispatch:

# true = Si entra un relevo nuevo o pulsas Run workflow, mata cualquier proceso colgado al instante
concurrency:
  group: quantfury_live_copilot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quantfury_copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar código y libro contable
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar Copiloto Continuo en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_CAPITAL: '2000'
        run: python bot.py

      - name: Guardar Contabilidad Actualizada en el Repositorio
        if: always()
        run: |
          git config --global user.name "Argon Quant Bot"
          git config --global user.email "bot@argonquant.local"
          git add portfolio_state.json || true
          git diff --staged --quiet || (git commit -m "Actualización contable Quantfury" && git pull --rebase -X ours && git push)
